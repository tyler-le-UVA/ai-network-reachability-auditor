# Ground truth for the Milestone 1 lab.
# Used to score the deterministic baseline (Milestone 3) and the AI auditor (Milestones 4-6).
#
# `match` blocks let the scorer pair a tool's finding with a planted issue.
# `verify` says which analyzer path proves a fix worked (Milestone 5). P4 has no live
# path to test (the db has no public IP), so it is verified by the baseline check alone.
# Names are the Name tags / group names Terraform sets, so they survive rebuilds
# (AWS IDs change every apply).

lab: network-auditor-milestone-1
vpc_cidr: 10.20.0.0/16

findings:
  - id: P1
    title: SSH open to the internet
    resource: aws_vpc_security_group_ingress_rule.web_ssh_world
    component: web security group
    detail: tcp/22 allowed from 0.0.0.0/0 on the web host
    reachable_from_internet: true
    severity: high
    fix: Restrict to an admin /32, or remove the rule and use SSM Session Manager
    match: {check: sensitive_port_open_to_world, security_group: network-auditor-web-sg, port: 22}
    verify: {source: internet, destination: web, port: 22, after: blocked}

  - id: P2
    title: RDP open to the internet on a Linux host
    resource: aws_vpc_security_group_ingress_rule.web_rdp_world
    component: web security group
    detail: tcp/3389 allowed from 0.0.0.0/0; the host runs Linux and has no use for RDP
    reachable_from_internet: true
    severity: high
    fix: Remove the rule
    match: {check: sensitive_port_open_to_world, security_group: network-auditor-web-sg, port: 3389}
    verify: {source: internet, destination: web, port: 3389, after: blocked}

  - id: P3
    title: Database port open to the whole VPC
    resource: aws_vpc_security_group_ingress_rule.db_mysql_vpc
    component: db security group
    detail: tcp/3306 allowed from 10.20.0.0/16 instead of only the web tier
    reachable_from_internet: false
    severity: medium
    fix: Replace cidr_ipv4 with referenced_security_group_id = web security group
    match: {check: db_port_from_cidr, security_group: network-auditor-db-sg, port: 3306}
    verify: {source: web, destination: db, port: 3306, after: reachable}  # the fix must keep the intended path

  - id: P4
    title: Private subnet routes directly to the internet gateway
    resource: aws_route_table.private
    component: private route table
    detail: >
      0.0.0.0/0 -> internet gateway on the "private" subnet. Latent risk: the db host
      has no public IP, so it is NOT reachable from the internet today, but any
      instance launched here with a public IP would be.
    reachable_from_internet: false
    severity: medium
    fix: Remove the route, or send 0.0.0.0/0 to a NAT gateway if outbound access is needed
    match: {check: private_subnet_routes_to_igw, subnet: network-auditor-private}

  - id: P5
    title: NACL silently blocks intended HTTP
    resource: aws_network_acl.public (ingress rule 90)
    component: public subnet NACL
    detail: >
      The web security group allows tcp/80, but NACL rule 90 denies tcp/80 inbound
      before rule 100 allows everything. HTTP is NOT reachable. A security-group-only
      check would wrongly report it as open.
    reachable_from_internet: false
    severity: low
    type: availability
    fix: Remove NACL rule 90 if the site should serve HTTP (or drop the SG rule if it shouldn't)
    match: {check: nacl_blocks_sg_allowed_port, network_acl: network-auditor-public-nacl, port: 80}
    verify: {source: internet, destination: web, port: 80, after: reachable}

controls:  # correct configurations the auditor should NOT flag
  - id: C1
    detail: tcp/443 open to 0.0.0.0/0 on the web host is intentional (public HTTPS)
  - id: C2
    detail: db host has no public IP
  - id: C3
    detail: both hosts require IMDSv2

# Seed set for evaluation. source/destination are roles:
#   internet = the VPC's internet gateway, web/db = instances by Role tag,
#   vpc = any address inside the VPC CIDR (no single host, so Reachability Analyzer skips it).
reachability_questions:
  - id: Q1
    question: Can the internet reach the web server on port 22?
    source: internet
    destination: web
    port: 22
    expected: yes
    because: P1
  - id: Q2
    question: Can the internet reach the web server on port 3389?
    source: internet
    destination: web
    port: 3389
    expected: yes
    because: P2
  - id: Q3
    question: Can the internet reach the web server on port 80?
    source: internet
    destination: web
    port: 80
    expected: no
    because: NACL rule 90 denies it (P5), even though the security group allows it
  - id: Q4
    question: Can the internet reach the web server on port 443?
    source: internet
    destination: web
    port: 443
    expected: yes
    because: intended (C1)
  - id: Q5
    question: Can the internet reach the database on port 3306?
    source: internet
    destination: db
    port: 3306
    expected: no
    because: db has no public IP (C2), although the private route table is misconfigured (P4)
  - id: Q6
    question: Can the web server reach the database on port 3306?
    source: web
    destination: db
    port: 3306
    expected: yes
    because: intended path
  - id: Q7
    question: Can any host in the VPC reach the database on port 3306?
    source: vpc
    destination: db
    port: 3306
    expected: yes
    because: P3 (should be web tier only)
